[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas-audio"
version = "0.1.0"
description = "Canvas LMS to audio: fetch course pages, clean them, optionally rewrite with an LLM, synthesize with ElevenLabs and publish to SoundCloud."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "itsdangerous>=2.2",
    "cryptography>=42.0",
    "anthropic>=0.34",
    "openai>=1.40",
    "mutagen>=1.47",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ARG"]
ignore = [
    "B008",   # FastAPI uses function calls (Depends/Query) in argument defaults by design
    "ARG001", # unused function args are common in FastAPI/pytest fixtures
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the project root on sys.path so `from tests.conftest import ...` works no
# matter whether pytest is started as `pytest` or `python -m pytest`.
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
