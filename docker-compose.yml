services:
  canvas-audio:
    build: .
    image: canvas-audio:latest
    container_name: canvas-audio
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Secrets come from the environment. Locally that is a .env file which is
    # never committed; in production, set real environment variables instead —
    # they take precedence and the Settings page marks them read-only.
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      OUTPUT_DIR: /output
      # Uncomment when serving over HTTPS so the session cookie gets Secure.
      # HTTPS_ONLY: "1"
    volumes:
      - ./data:/data
      - ./output:/output
      # Prices can be corrected without rebuilding the image.
      - ./pricing.toml:/app/pricing.toml:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
