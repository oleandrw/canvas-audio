# ---------------------------------------------------------------------------
# Price and model configuration.
#
# Nothing in the application hardcodes a price: everything below is read at
# runtime, so when a provider changes its prices you edit this file only.
# Point PRICING_FILE at another path to override it entirely.
#
# All prices are in USD and are ESTIMATES used for the pre-flight cost display.
# They are not invoices. Verify against your provider dashboard.
#
# Sources (checked 2026-09-10):
#   ElevenLabs  https://elevenlabs.io/pricing/api
#   OpenAI      https://developers.openai.com/api/docs/pricing
#   Anthropic   https://www.anthropic.com/pricing
# ---------------------------------------------------------------------------

[meta]
updated = "2026-09-10"

[currency]
# Approximate local-currency display. Update the rate manually; the app does not
# call a live FX service (one less network dependency that can fail).
code = "NOK"
symbol = "kr"
usd_rate = 10.5

[estimation]
# Used only to *estimate* token counts before a call. Actual usage is recorded
# from the provider response after the call.
chars_per_token = 4.0
# Rewriting for speech returns roughly as much text as it receives.
output_ratio = 1.1

# ---------------------------------------------------------------------------
# ElevenLabs — USD per 1000 characters
# ---------------------------------------------------------------------------

[elevenlabs]
default_usd_per_1k_chars = 0.10

[elevenlabs.models]
eleven_v3 = 0.10
eleven_multilingual_v2 = 0.10
eleven_multilingual_v1 = 0.10
eleven_monolingual_v1 = 0.10
eleven_turbo_v2_5 = 0.05
eleven_turbo_v2 = 0.05
eleven_flash_v2_5 = 0.05
eleven_flash_v2 = 0.05

# ---------------------------------------------------------------------------
# OpenAI — USD per 1 000 000 tokens
# ---------------------------------------------------------------------------

[openai]
default_model = "gpt-5.6-terra"

[openai.models."gpt-6-astra"]
label = "GPT-6 Astra"
input = 10.00
output = 50.00

[openai.models."gpt-5.6-sol"]
label = "GPT-5.6 Sol"
input = 4.00
output = 20.00

[openai.models."gpt-5.6-terra"]
label = "GPT-5.6 Terra"
input = 2.00
output = 12.00

[openai.models."gpt-5.6-luna"]
label = "GPT-5.6 Luna (rimeligst)"
input = 0.20
output = 1.20

[openai.models."gpt-5-mini"]
label = "GPT-5 mini"
input = 0.25
output = 2.00

[openai.models."gpt-5-nano"]
label = "GPT-5 nano"
input = 0.05
output = 0.40

# ---------------------------------------------------------------------------
# Anthropic — USD per 1 000 000 tokens
# `effort`    marks models that accept output_config.effort.
# `fallbacks` marks models that accept server-side refusal fallbacks.
# ---------------------------------------------------------------------------

[anthropic]
default_model = "claude-opus-5"

[anthropic.models."claude-opus-5"]
label = "Claude Opus 5"
input = 5.00
output = 25.00
effort = true
fallbacks = true

[anthropic.models."claude-sonnet-5"]
label = "Claude Sonnet 5"
input = 2.00
output = 10.00
effort = true
fallbacks = false

[anthropic.models."claude-haiku-4-5"]
label = "Claude Haiku 4.5 (rimeligst)"
input = 1.00
output = 5.00
effort = false
fallbacks = false

[anthropic.models."claude-opus-4-8"]
label = "Claude Opus 4.8"
input = 5.00
output = 25.00
effort = true
fallbacks = true
