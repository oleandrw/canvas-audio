# Deployment workflow, kept separate from CI on purpose.
#
# Builds the image, pushes it to GitHub Container Registry, and (optionally)
# has a server pull that exact image and restart. Nothing here contains
# credentials: every value comes from GitHub Secrets or the built-in token.
#
# The server restart runs only when the repository variable DEPLOY_ENABLED is
# "true", and needs these secrets:
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH
# DEPLOY_PATH must contain docker-compose.prod.yml and a .env (see README).

name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # The default "docker" driver cannot export a build cache; the GitHub
      # Actions cache (cache-to: type=gha) needs a docker-container builder.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Restart the server
    runs-on: ubuntu-latest
    needs: build-and-push
    # Off until the server is set up, so the workflow is harmless in a fork or
    # a fresh clone.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    environment: production
    # This job only pulls the image, so its token gets read-only package access.
    permissions:
      contents: read
      packages: read
    steps:
      - name: Pull and restart over SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          # Pin the exact commit that was just built, not a moving :latest tag.
          IMAGE: ${{ needs.build-and-push.outputs.image }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          # Short-lived (expires when this job ends) and read-only, see above.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH,IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            # The image is private: log in for the pull, and always log out
            # again so no registry credential is left behind on the server.
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export CANVAS_AUDIO_IMAGE="$IMAGE"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
